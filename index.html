<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Stuti 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#ffeaf4);
min-height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.screen{
width:90%;
max-width:500px;
padding:25px;
animation:fade .6s ease;
}

h1{
color:#ff4f8b;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.6;
color:#444;
}

img{
width:100%;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

.box{
background:white;
padding:18px;
margin:10px;
border-radius:20px;
box-shadow:0 5px 15px #ffb6d2;
}

button{
background:#ff4f8b;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
font-size:16px;
margin-top:15px;
}

.letter{
background:#fff;
padding:25px;
border-radius:15px;
animation:open 1s ease;
box-shadow:0 0 20px #ffb6d2;
}

.puzzle{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:2px;
}

.piece{
aspect-ratio:1;
background-repeat:no-repeat;
border:1px solid white;
}

.heart{
position:absolute;
animation:float 6s linear infinite;
}

@keyframes fade{
from{opacity:0;transform:scale(.9);}
to{opacity:1;transform:scale(1);}
}

@keyframes open{
from{transform:rotateX(90deg);}
to{transform:rotateX(0);}
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-100px);}
}
</style>
</head>

<body>

<div id="content" class="screen"></div>
<script>

const content = document.getElementById("content");

let current = 0;

const pages = [

`<div class="box">
<h1>Heyyyy!!!!!! 💖</h1>
<p>
I have made something just for you... ✨<br><br>
(Don't cry 😂)
</p>
<p>Tap anywhere 💕</p>
</div>`,

`<div class="box">
<h1>💖</h1>
<p>Just remember that I love you.</p>
</div>`,

`<img src="photo1.jpg">`,

`<div class="box">
<h1>💚</h1>
<p>I will always be by your side.</p>
</div>`,

`<img src="photo2.jpg">`,

`<div id="puzzle3"></div>`,

`<div class="box">
<h1>🌸</h1>
<p>You are the best and the cutest girl I have ever met.</p>
</div>`,

`<div id="puzzle4"></div>`,

`<div class="box">
<h1>🎉</h1>
<p>Cheers to our 9 years of friendship.</p>
</div>`,

`<div class="box">
<h1>💬 Little Messages 💖</h1>

<div class="box">You are very special to me ❤️</div>
<div class="box">Thank you for always being there 🫶</div>
<div class="box">Never forget our memories ✨</div>

</div>`,

`<div class="box">
<h1>🔐 Secret Puzzle</h1>

<p>Answer these questions to open your letter 💌</p>

<p>1. Hum konsi class me the jb hum dost bane?</p>
<input id="q1" type="text" placeholder="Your answer">

<br><br>

<p>2. Tell one date which we will never forget ❤️</p>
<input id="q2" type="text" placeholder="Your answer">

<br><br>

<p>3. Our password?</p>
<input id="q3" type="text" placeholder="Your answer">

<br>
<button onclick="checkCode()">Unlock 💌</button>

<p id="error"></p>

</div>`,

`<div class="letter">

<h1>❤️ Hiii...</h1>

<p>

Just wanna say thank you for being the most amazing friend I could ever ask for.<br><br>

You are truly the most beautiful part of my life. Every moment with you is my favourite.<br><br>

I never thought I would say this... But u mean a lot to me.<br><br>

Maybe we never share our feelings for each other but deep inside we both know how important we both are for each other.<br><br>

Don't know about u 😂 but mere liye toh tu bhut special hai.<br><br>

I will keep u with me always ❤️<br><br>

Love you 🫶

</p>

</div>`

];


content.innerHTML = pages[0];


function nextPage(){

if(current < pages.length-1){

current++;

content.innerHTML = pages[current];

if(current===5){
createPuzzle("photo3.jpg","puzzle3");
}

if(current===7){
createPuzzle("photo4.jpg","puzzle4");
}

}

}

document.body.onclick=function(e){

if(
e.target.tagName==="INPUT" ||
e.target.tagName==="BUTTON" ||
e.target.classList.contains("piece") ||
e.target.closest(".puzzle") ||
e.target.closest("#puzzle3") ||
e.target.closest("#puzzle4")
){
return;
}

nextPage();

}


function checkCode(){

let a=document.getElementById("q1").value.toLowerCase();
let b=document.getElementById("q2").value.toLowerCase();
let c=document.getElementById("q3").value.toLowerCase();


if(a=="4th class" && b=="5th july" && c=="1234567890as"){

current++;
content.innerHTML=pages[current];

}

else{

document.getElementById("error").innerHTML="Wrong answer 😜 Try again";

return;

}

else{

document.getElementById("error").innerHTML="Wrong answer 😜 Try again";

}

}
  function createPuzzle(image, id){

let box = document.getElementById(id);

let pieces = [];

for(let i=0;i<16;i++){
pieces.push(i);
}

pieces.sort(()=>Math.random()-0.5);


let html = `
<h1>🧩 Solve the Puzzle</h1>
<div class="puzzle" id="${id}grid">
`;


pieces.forEach(piece=>{

let x = piece % 4;
let y = Math.floor(piece/4);

html += `
<div class="piece"
draggable="true"
data-index="${piece}"
style="
background-image:url('${image}');
background-size:400% 400%;
background-position:${x*33.33}% ${y*33.33}%;
">
</div>
`;

});


html += `
</div>
<p id="${id}msg"></p>
`;

box.innerHTML = html;


let allPieces = document.querySelectorAll(`#${id}grid .piece`);

let dragged = null;


allPieces.forEach(piece=>{


piece.addEventListener("dragstart",function(){

dragged=this;

});


piece.addEventListener("dragover",function(e){

e.preventDefault();

});


piece.addEventListener("drop",function(){


let bg = this.style.backgroundPosition;
let index = this.dataset.index;


this.style.backgroundPosition = dragged.style.backgroundPosition;
this.dataset.index = dragged.dataset.index;


dragged.style.backgroundPosition = bg;
dragged.dataset.index = index;


checkComplete(id);


});


});

}



function checkComplete(id){

let pieces=document.querySelectorAll(`#${id}grid .piece`);

let complete=true;


pieces.forEach((piece,i)=>{

if(Number(piece.dataset.index)!==i){

complete=false;

}

});


if(complete){

document.getElementById(id+"msg").innerHTML=
"🎉 Puzzle Completed 💖";


let button=document.createElement("button");

button.innerHTML="Next 💕";


button.onclick=function(){

nextPage();

};


document.getElementById(id).appendChild(button);

}

  }



// floating hearts

for(let i=0;i<25;i++){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*20)+"px";
heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
